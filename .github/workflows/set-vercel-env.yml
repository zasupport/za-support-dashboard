name: Set Vercel Env Vars

on:
  workflow_dispatch:

jobs:
  set-env:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Reset all env vars across all environments
        run: |
          # Remove from all environments
          for env in production preview development; do
            vercel env rm ZA_API_URL $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
            vercel env rm ZA_API_TOKEN $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
            vercel env rm DASHBOARD_PASSWORD $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          done

          # Add to all environments using printf to avoid trailing newline
          printf '%s' 'https://api.zasupport.com' | vercel env add ZA_API_URL production --token=$VERCEL_TOKEN
          printf '%s' 'https://api.zasupport.com' | vercel env add ZA_API_URL preview --token=$VERCEL_TOKEN
          printf '%s' '${{ secrets.ZA_API_TOKEN }}' | vercel env add ZA_API_TOKEN production --token=$VERCEL_TOKEN
          printf '%s' '${{ secrets.ZA_API_TOKEN }}' | vercel env add ZA_API_TOKEN preview --token=$VERCEL_TOKEN
          printf '%s' 'zasupport2026' | vercel env add DASHBOARD_PASSWORD production --token=$VERCEL_TOKEN
          printf '%s' 'zasupport2026' | vercel env add DASHBOARD_PASSWORD preview --token=$VERCEL_TOKEN

          echo "All env vars set."

      - name: Trigger fresh production deploy
        run: |
          vercel deploy --prod --token=$VERCEL_TOKEN --yes
          echo "Deployed."
