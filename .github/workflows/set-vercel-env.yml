name: Set Vercel Env Vars

on:
  workflow_dispatch:

jobs:
  set-env:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Set env vars via Vercel CLI
        run: |
          # Remove existing env vars (ignore errors if they don't exist)
          echo "Removing existing env vars..."
          vercel env rm ZA_API_URL production --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          vercel env rm ZA_API_TOKEN production --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          vercel env rm DASHBOARD_PASSWORD production --yes --token=$VERCEL_TOKEN 2>/dev/null || true

          # Add new env vars
          echo "Setting ZA_API_URL..."
          echo "https://api.zasupport.com" | vercel env add ZA_API_URL production --token=$VERCEL_TOKEN

          echo "Setting ZA_API_TOKEN..."
          echo "${{ secrets.ZA_API_TOKEN }}" | vercel env add ZA_API_TOKEN production --token=$VERCEL_TOKEN

          echo "Setting DASHBOARD_PASSWORD..."
          echo "${{ secrets.DASHBOARD_PASSWORD }}" | vercel env add DASHBOARD_PASSWORD production --token=$VERCEL_TOKEN

          echo "All env vars set."

      - name: Trigger fresh production deploy
        run: |
          vercel deploy --prod --token=$VERCEL_TOKEN --yes
          echo "Deploy triggered."
