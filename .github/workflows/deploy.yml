name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'memory/**'
      - '.gitignore'
      - '*.log'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

# Vercel Git Integration deploys automatically on push — no CLI needed.
# CLI was passing -e NEXT_PUBLIC_API_URL= (secret missing) which overwrote
# Vercel's project env var with empty string → portal pages built with empty
# base URL → fetch failed → static page generation crashed at 90/121.

jobs:
  # ── TYPE CHECK ────────────────────────────────────────────────────────────
  validate:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  # ── WAIT FOR GIT INTEGRATION DEPLOY ──────────────────────────────────────
  wait-for-deploy:
    name: Wait for Vercel Deploy
    needs: validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Poll dashboard until live
        run: |
          echo "Waiting for Vercel Git Integration to deploy..."
          for i in $(seq 1 20); do
            HTTP=$(curl -sI "https://dashboard.zasupport.com" --max-time 10 -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
            if [[ "$HTTP" == "200" || "$HTTP" == "302" || "$HTTP" == "307" ]]; then
              echo "Dashboard live (attempt $i, HTTP $HTTP)"
              sleep 10
              break
            fi
            echo "  Attempt $i: HTTP $HTTP — waiting 15s..."
            sleep 15
            if [[ $i -eq 20 ]]; then
              echo "WARN: dashboard did not respond after 5 min — continuing"
            fi
          done

  # ── RETEST ───────────────────────────────────────────────────────────────
  retest:
    name: Health Check
    needs: wait-for-deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Dashboard health check
        run: |
          FAIL=0
          HTTP=$(curl -sI "https://dashboard.zasupport.com" --max-time 15 -o /dev/null -w "%{http_code}" 2>/dev/null)
          if [[ "$HTTP" == "200" || "$HTTP" == "302" || "$HTTP" == "307" ]]; then
            echo "  PASS dashboard responds ($HTTP)"
          else
            echo "  FAIL dashboard unreachable ($HTTP)"
            FAIL=$((FAIL+1))
          fi
          echo "Health: $FAIL failure(s)"; [[ $FAIL -eq 0 ]] || exit 1

      - name: Notify via ntfy
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="Dashboard deployed and healthy"
          else
            MSG="Dashboard deploy or health check FAILED"
          fi
          curl -s -d "$MSG" "https://ntfy.sh/zasupport-courtney-alerts" \
            -H "Title: ZA Support Deploy" \
            -H "Priority: default" || true
